[package]
name = "nixos-package-search"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
# Icon decoding. `image` is already in the tree (eframe/arboard pull it in,
# with exactly this feature), so the png half of this costs no new crates.
# resvg is built without its text/font features: 11 new crates instead of 30,
# and application icons are shapes rather than text.
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.45", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
